[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyembpack"
version = "0.1.0"
description = "CLI extractor/packer for Dragon Ball Xenoverse 2 .emb files"
requires-python = ">=3.12"
dependencies = [
    "tqdm>=4.66",
]

[project.scripts]
pyembpack = "pyembpack.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]